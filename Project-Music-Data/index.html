<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Music Listening Stats</title>
  </head>
  <body>
    <main>
      <h1>Music Listening Stats</h1>

      <section aria-labelledby="user-selection">
        <h2 id="user-selection">User Selection</h2>

        <p id="instruction">
          Select a user using the drop down below to view their analysed data.
        </p>

        <label for="userSelect">Select a user:</label>
        <select
          id="userSelect"
          aria-label="User selection"
        ></select>

        
      </section>

      <section aria-labelledby="analysis-results">
        <h2 id="analysis-results">Analysed Data</h2>

        <section
          id="results"
          aria-live="polite"
        ></section>
      </section>
    </main>

    <script type="module" src="./script.mjs"></script>
  </body>
</html>
